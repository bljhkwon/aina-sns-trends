<script>
document.querySelectorAll('.ig-action.like-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    btn.classList.toggle('liked');
    const n=btn.querySelector('.like-count');
    if(n){const v=parseInt(n.textContent);n.textContent=btn.classList.contains('liked')?v+1:v-1}
  });
});
</script></body>
