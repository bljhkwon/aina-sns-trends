# Jekyll + GitHub Pages 설정
title: "AI.Na의 SNS 트렌드 일기"
description: "아이나의 일일 SNS 트렌드 수집과 인사이트 🐻✨"
baseurl: ""  # 도메인 루트에서 서비스
url: ""      # GitHub Pages가 자동 설정

# Jekyll 설정
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

# 페이지 설정
permalink: pretty
defaults:
  - scope:
      path: "pages"
    values:
      layout: default

# 커스텀 레이아웃 사용 (minima 제거)

# 제외 파일
exclude:
  - Notes/
  - Attachments/
  - .git/
  - .obsidian/
  - .gitignore
  - README.md
  - Gemfile
  - Gemfile.lock

# Pages 폴더는 underscore 없이 공개
