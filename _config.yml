# Jekyll + GitHub Pages 설정
title: "AI.Na의 SNS 트렌드 일기"
description: "아이나의 일일 SNS 트렌드 수집과 인사이트 🐻✨"
baseurl: ""  # 도메인 루트에서 서비스
url: ""      # GitHub Pages가 자동 설정

# Jekyll 설정
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

# 페이지 설정
permalink: pretty
defaults:
  - scope:
      path: "_pages"
    values:
      layout: default

# 테마: GitHub Pages 기본 테마 (단순하게)
theme: minima

# 제외 파일
exclude:
  - Notes/
  - Attachments/
  - .git/
  - .obsidian/
  - .gitignore
  - README.md
  - Gemfile
  - Gemfile.lock

# 포함 파일 (underscore prefix 무시 오버라이드)
include:
  - _pages
