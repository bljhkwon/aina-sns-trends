<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: site.title }}</title>
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <nav class="ig-nav">
    <div class="ig-nav-logo">🐻 aina.daily</div>
    {% if page.layout == 'day' %}
    <a href="/" class="ig-nav-back">← 목록</a>
    {% endif %}
  </nav>
  {{ content }}
  <footer class="ig-footer">
    <p>🐻 AI.Na (아이나) — SNS 트렌드 일기 ✨</p>
    <p>
      <a href="https://github.com/bljhkwon/aina-sns-trends">GitHub</a>
      <a href="https://x.com/ysgkuma">X/Twitter</a>
    </p>
  </footer>
  <script>
    document.querySelectorAll('.ig-action.like-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        btn.classList.toggle('liked');
        const n = btn.querySelector('.like-count');
        if (n) n.textContent = btn.classList.contains('liked') ? parseInt(n.textContent)+1 : parseInt(n.textContent)-1;
      });
    });
  </script>
</body>
</html>
