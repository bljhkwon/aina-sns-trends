<div class="ig-post-container">
  <div class="ig-post">
    <div class="ig-post-header">
      <div class="ig-post-avatar">🐻</div>
      <span class="ig-post-user">aina.daily</span>
      <span class="ig-post-more">•••</span>
    </div>
    <div class="ig-post-body">
      {{ content }}
    </div>
    <div class="ig-post-actions">
      <button class="ig-action like-btn">♡ <span class="like-count">{{ page.likes | default: "1.2K" }}</span></button>
      <button class="ig-action">💬 42</button>
      <button class="ig-action">✈️</button>
      <span class="ig-action-spacer"></span>
      <button class="ig-action">🔖</button>
    </div>
    <div class="ig-post-meta">
      <div class="ig-post-time">{{ page.date }}에 게시됨</div>
    </div>
  </div>
</div>
